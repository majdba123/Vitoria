# CI/CD Pipeline for MSZ bayer
name: Deploy to Production

concurrency:
  group: production-deployment
  cancel-in-progress: false

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, curl, zip, pdo, mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_SHA
          script: |
            set -Eeuo pipefail
            cd /var/www/MSZ

            if [ ! -f .env ]; then
              echo "ERROR: /var/www/MSZ/.env is missing"
              exit 1
            fi

            if ! command -v mysqldump >/dev/null 2>&1; then
              echo "ERROR: mysqldump is required for a recoverable deployment"
              exit 1
            fi

            set -a
            source .env
            set +a

            if [ -z "${DB_DATABASE:-}" ] || [ -z "${DB_USERNAME:-}" ]; then
              echo "ERROR: database backup credentials are incomplete"
              exit 1
            fi

            php artisan tinker --execute='echo "PRE_DEPLOY_SSR_ENABLED=".(config("inertia.ssr.enabled") ? "true" : "false").PHP_EOL;'
            if curl -fsS --max-time 3 http://127.0.0.1:13714/health > /dev/null; then
              echo "PRE_DEPLOY_SSR_HEALTH=healthy"
            else
              echo "PRE_DEPLOY_SSR_HEALTH=unreachable"
            fi

            php artisan down --retry=60
            cleanup() {
              php artisan up || true
            }
            trap cleanup EXIT

            mkdir -p storage/backups
            backup_path="storage/backups/pre-deploy-$(date +%Y%m%d%H%M%S)-${DEPLOY_SHA}.sql.gz"
            MYSQL_PWD="${DB_PASSWORD:-}" mysqldump \
              --single-transaction \
              --quick \
              --no-tablespaces \
              -h"${DB_HOST:-127.0.0.1}" \
              -P"${DB_PORT:-3306}" \
              -u"$DB_USERNAME" \
              "$DB_DATABASE" | gzip > "$backup_path"

            test -s "$backup_path"

            # Fix git ownership issue
            git config --global --add safe.directory /var/www/MSZ

            # Force update to the exact commit CI passed on (not just whatever origin/main is at SSH time)
            git fetch origin
            git reset --hard "$DEPLOY_SHA"

            # This release intentionally disables SSR until a supervised
            # renderer is installed and its route-resolution failure is fixed.
            if grep -q '^INERTIA_SSR_ENABLED=' .env; then
              sed -i 's/^INERTIA_SSR_ENABLED=.*/INERTIA_SSR_ENABLED=false/' .env
            else
              printf '\nINERTIA_SSR_ENABLED=false\n' >> .env
            fi
            php artisan config:clear

            # Install/update Composer dependencies
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            # Install NPM dependencies and build
            npm ci
            npm run build

            # Run migrations
            php artisan migrate --force

            # Restart queue workers (if using)
            php artisan queue:restart

            # Rebuild caches (do NOT run optimize:clear after this — it wipes what we just built)
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan tinker --execute='echo "POST_DEPLOY_SSR_ENABLED=".(config("inertia.ssr.enabled") ? "true" : "false").PHP_EOL;'

            # Fix permissions
            chown -R www-data:www-data .
            chmod -R 775 storage
            chmod -R 775 bootstrap/cache

            # Restart services
            systemctl reload php8.3-fpm
            systemctl reload nginx
            supervisorctl restart msz-reverb

            php artisan up

            # Verify the app actually came back up before declaring success (APP_URL comes from the server's own .env)
            if [ -n "${APP_URL:-}" ]; then
              curl -fsS "${APP_URL%/}/up" > /dev/null
            else
              echo "WARNING: APP_URL not found in .env, skipping post-deploy health check"
            fi

            trap - EXIT
            echo "Deployment completed successfully!"
