# Production deployment pipeline for Vitoria
name: Deploy to Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, curl, zip, pdo, mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_SHA
          script: |
            set -Eeuo pipefail
            cd /var/www/MSZ

            if [ ! -f .env ]; then
              echo "ERROR: /var/www/MSZ/.env is missing"
              exit 1
            fi

            if ! command -v mysqldump >/dev/null 2>&1; then
              echo "ERROR: mysqldump is required for a recoverable deployment"
              exit 1
            fi

            set -a
            source .env
            set +a

            if [ -z "${DB_DATABASE:-}" ] || [ -z "${DB_USERNAME:-}" ]; then
              echo "ERROR: database backup credentials are incomplete"
              exit 1
            fi

            php artisan tinker --execute='echo "PRE_DEPLOY_SSR_ENABLED=".(config("inertia.ssr.enabled") ? "true" : "false").PHP_EOL;'
            if curl -fsS --max-time 3 http://127.0.0.1:13714/health > /dev/null; then
              echo "PRE_DEPLOY_SSR_HEALTH=healthy"
            else
              echo "PRE_DEPLOY_SSR_HEALTH=unreachable"
            fi

            php artisan down --retry=60
            cleanup() {
              php artisan up || true
            }
            trap cleanup EXIT

            mkdir -p storage/backups
            backup_path="storage/backups/pre-deploy-$(date +%Y%m%d%H%M%S)-${DEPLOY_SHA}.sql.gz"
            MYSQL_PWD="${DB_PASSWORD:-}" mysqldump \
              --single-transaction \
              --quick \
              --no-tablespaces \
              -h"${DB_HOST:-127.0.0.1}" \
              -P"${DB_PORT:-3306}" \
              -u"$DB_USERNAME" \
              "$DB_DATABASE" | gzip > "$backup_path"

            test -s "$backup_path"

            git config --global --add safe.directory /var/www/MSZ

            # Deploy the exact commit that passed CI rather than the moving branch head.
            git fetch origin
            git reset --hard "$DEPLOY_SHA"

            # SSR remains disabled until a supervised renderer and route-resolution
            # path are intentionally deployed and validated.
            if grep -q '^INERTIA_SSR_ENABLED=' .env; then
              sed -i 's/^INERTIA_SSR_ENABLED=.*/INERTIA_SSR_ENABLED=false/' .env
            else
              printf '\nINERTIA_SSR_ENABLED=false\n' >> .env
            fi
            php artisan config:clear

            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            npm ci
            npm run build

            php artisan migrate --force
            php artisan queue:restart

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan tinker --execute='echo "POST_DEPLOY_SSR_ENABLED=".(config("inertia.ssr.enabled") ? "true" : "false").PHP_EOL;'

            chown -R www-data:www-data .
            chmod -R 775 storage
            chmod -R 775 bootstrap/cache

            systemctl reload php8.3-fpm
            systemctl reload nginx
            supervisorctl restart msz-reverb

            php artisan up

            if [ -n "${APP_URL:-}" ]; then
              curl -fsS "${APP_URL%/}/up" > /dev/null
            else
              echo "WARNING: APP_URL not found in .env, skipping post-deploy health check"
            fi

            trap - EXIT
            echo "Deployment completed successfully"
